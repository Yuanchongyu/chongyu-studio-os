<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f8fc" />
  <title>Chongyu Studio OS</title>
  <link rel="stylesheet" href="styles.css?v=lighttech-20260908" />
  <link rel="stylesheet" href="media-upload.css?v=ai-inbox-20260908" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">C</div><div><strong>Chongyu Studio</strong><span id="brandSub">AI Education OS</span></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom"><span id="memoryStatus">🔒 点击连接公司记忆</span></div>
    </aside>
    <main>
      <header class="topbar">
        <div><div class="eyebrow" id="workspaceLabel">创始人控制台</div><h1 id="pageTitle">指挥中心</h1></div>
        <div class="top-actions">
          <div class="lang-switch" aria-label="Language switcher"><button id="langEn" onclick="setLanguage('en')">EN</button><button id="langZh" onclick="setLanguage('zh')">中文</button></div>
          <button class="ghost" id="modelBtn" disabled>ChatGPT · 主 AI 操作员</button>
          <button class="ghost" id="uploadBtn" onclick="openMediaUploader()">↑ AI 素材箱</button>
          <button class="primary" id="captureBtn" onclick="openInboxComposer()">+ 记录</button>
        </div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
  <div id="modal" class="modal hidden"></div>
  <script src="data/seed.js?v=20260908"></script>
  <script src="app.js?v=lighttech-20260908"></script>
  <script src="studio-live.js?v=lighttech-20260908"></script>
  <script src="media-upload.js?v=ai-inbox-20260908"></script>
